run:
  run_name: synthdata-baseline
  output_dir: ../outputs
  seed: 42

paths:
  weak_cases_jsonl: ../data/weak_cases.jsonl
  baseline_dataset_jsonl: ../data/baseline_dataset.jsonl
  lesson4_failure_samples_jsonl: ../../outputs/eval-rag-baseline/baseline/failure_samples.jsonl

generation:
  num_candidates_per_case: 3
  style_variants:
    - concise
    - procedural
    - checklist
  require_gpu: false
  allow_cpu_fallback: true

output:
  selected_weak_cases_jsonl: selected_weak_cases.jsonl
  candidates_jsonl: candidates.jsonl
  generation_summary_json: generation_summary.json
  filter_all_jsonl: filtered_candidates.jsonl
  accepted_jsonl: accepted_candidates.jsonl
  rejected_jsonl: rejected_candidates.jsonl
  filter_summary_json: filter_summary.json
  augmented_dataset_jsonl: augmented_dataset.jsonl
  merge_summary_json: merge_summary.json
  baseline_rerun_json: baseline_rerun.json
  augmented_rerun_json: augmented_rerun.json
  comparison_json: comparison.json
  comparison_report_md: comparison_report.md

