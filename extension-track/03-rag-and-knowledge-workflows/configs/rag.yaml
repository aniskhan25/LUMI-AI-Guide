run:
  run_name: rag-baseline
  output_dir: outputs
  seed: 42

data:
  corpus_jsonl: data/corpus.jsonl
  queries_jsonl: data/queries.jsonl
  doc_id_key: doc_id
  title_key: title
  text_key: text
  metadata_key: metadata
  query_id_key: query_id
  query_text_key: query

chunking:
  chunk_words: 120
  overlap_words: 30
  min_chunk_words: 20

embedding:
  model_name: sentence-transformers/all-MiniLM-L6-v2
  trust_remote_code: false
  batch_size: 16
  max_seq_len: 256
  normalize: true

retrieval:
  top_k: 3
  score_type: cosine

generation:
  model_name: distilgpt2
  trust_remote_code: false
  max_input_length: 768
  max_new_tokens: 96
  do_sample: false
  temperature: 1.0
  top_p: 1.0

runtime:
  allow_cpu_fallback: false

output:
  chunks_jsonl: chunks.jsonl
  embeddings_jsonl: embeddings.jsonl
  retriever_index_npz: retriever_index.npz
  retrieval_results_jsonl: retrieval_results.jsonl
  answers_jsonl: answers.jsonl
  summary_json: run_summary.json
